name: 欢乐钓鱼大师每日兑码

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily.yml'

permissions:
  contents: write

concurrency:
  group: gift-daily
  cancel-in-progress: false

jobs:
  gift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 部署脚本并运行
        run: |
          printf '%s' '' | base64 -d > gift_cloud.py
          python3 gift_cloud.py
      - name: 回写状态与结果
        run: |
          git config user.name "gift-bot"
          git config user.email "gift-bot@users.noreply.github.com"
          git add gift_cloud.py state.json RESULT.md HISTORY.md
          git diff --cached --quiet || (git commit -m "daily gift" && git push)
